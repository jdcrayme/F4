# Continuous integration — four jobs:
#
# 1. headless — every GUI/viewer target OFF, full test suite. Mirrors the
#    local verification workflow used throughout the worklog (e.g.
#    WEAPONS-2b): the same command sequence that produced the
#    "1,539/1,539 green" STEP-0 baseline.
# 2. gl — every target ON (raylib, f4-renderer, both viewers, scenario
#    player) under xvfb. This is the job that catches world-viewer /
#    renderer compile breaks; the headless job never builds those targets.
#    The GPU-context tests (orbit_camera, lit_shader, texture_cache,
#    draw_3d, feature_mesh, world_renderer) run for real under xvfb's
#    software GL (llvmpipe supports GL 3.3+, which raylib 5.0 needs); on
#    a display-less runner they self-skip via display_guard.hpp instead
#    of segfaulting.
# 3. windows — the MSVC headless build + test. The primary development
#    platform (F4.runsettings, export-game-data.bat, the Windows-path
#    subtleties throughout the CHANGELOG) had NO CI coverage: an
#    MSVC-only compile break (or a /std:c++20 conformance drift) landed
#    untested. This job is the headless shape over the Visual Studio
#    generator — the GUI targets stay off (no DirectX/raylib surface on
#    the runner needed for the libraries the suite exercises).
# 4. sanitize — the headless suite under ASan + UBSan. The
#    ScopedSubscriptions UAF the FID-OPT-1 speed-up exposed was caught
#    by a LOCAL sanitizer run; nothing in CI would have caught the same
#    leak class landing on main. Debug info on, frame pointers kept, the
#    whole fast-tier suite (the slow 1x war harnesses are excluded the
#    same way the default ctest run excludes them).
#
# Notes:
# - Debug build: the suite's value is precisely in the assertions and
#   contract checks that only fire there (the STEP-0 fixes exist because
#   Debug asserts contradicted tested contracts).
# - GCC 14 to match the development toolchain (GCC 14.2 locally).
# - FetchContent (GoogleTest v1.14.0, nlohmann/json v3.11.3, raylib 5.0,
#   Dear ImGui, rlImGui) needs network access, which GitHub-hosted
#   runners provide.
# - -DF4_ENFORCE_BOUNDARY=ON on BOTH jobs: the Tranche 0b/0d importer/
#   runtime boundary check is a configure-time gate (cmake/
#   verify_boundary.cmake) — a runtime target that links a legacy binary
#   parser must fail CI, not just the local build.
# - DigiMission.FullLoop* and the F4_INSTALL-dependent tests skip
#   gracefully without a game install (GTEST_SKIP) — that is expected on
#   CI, same as on a clean local checkout.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch — direct pushes to main are
# the norm in this repo, so this mainly saves PR minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  headless:
    name: Headless build + test (GCC 14, Debug)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      CC: gcc-14
      CXX: g++-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Data/ hygiene gate (sub-second): the committed manifest must match
      # the committed Data/ tree byte-for-byte — the same invariant the
      # Sha256.ReproducesCommittedManifestFingerprints test enforces, but
      # fail-fast before the build instead of after it. Catches the
      # "regenerated Data/ locally, forgot the manifest" push class.
      - name: Data/ manifest hygiene check
        run: python3 scripts/generate_manifest.py --check --output Data/

      - name: Install toolchain (g++-14)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-14

      - name: Report toolchain
        run: |
          echo "cmake: $(cmake --version | head -1)"
          echo "g++:   $(g++-14 --version | head -1)"

      - name: Configure (headless — all X11/OpenGL targets OFF, boundary gate ON)
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DF4_ENFORCE_BOUNDARY=ON
          -DF4_BUILD_RENDERER=OFF
          -DF4_BUILD_MODEL_VIEWER=OFF
          -DF4_BUILD_VIEWER=OFF
          -DF4_BUILD_SCENARIO_PLAYER=OFF

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure -j"$(nproc)"

  gl:
    name: Full GL build + test (GCC 14, Debug, xvfb)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      CC: gcc-14
      CXX: g++-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Data/ manifest hygiene check
        run: python3 scripts/generate_manifest.py --check --output Data/

      - name: Install toolchain + X11/OpenGL dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-14 \
            libx11-dev libxext-dev libxfixes-dev libxi-dev \
            libxcursor-dev libxrandr-dev libxinerama-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            xvfb

      - name: Configure (every target ON, boundary gate ON)
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DF4_ENFORCE_BOUNDARY=ON

      - name: Build
        run: cmake --build build -j"$(nproc)"

      # xvfb-run provides a virtual X display so the GPU-context tests
      # execute against Mesa's software renderer instead of skipping.
      - name: Test (under xvfb)
        run: xvfb-run -a -s "-screen 0 1024x768x24" ctest --test-dir build --output-on-failure

      - name: Boundary verifier (explicit re-configure, every target enabled)
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DF4_ENFORCE_BOUNDARY=ON

  windows:
    name: MSVC headless build + test (Debug)
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Data/ hygiene gate — the same invariant the Linux jobs check.
      # `python` (not python3) is the interpreter name on Windows runners.
      - name: Data/ manifest hygiene check
        run: python scripts/generate_manifest.py --check --output Data/

      - name: Configure (headless, MSVC default generator, boundary gate ON)
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DF4_ENFORCE_BOUNDARY=ON
          -DF4_BUILD_RENDERER=OFF
          -DF4_BUILD_MODEL_VIEWER=OFF
          -DF4_BUILD_VIEWER=OFF
          -DF4_BUILD_SCENARIO_PLAYER=OFF

      - name: Build
        run: cmake --build build --config Debug -j

      # ctest needs the config spelled out for multi-config generators.
      - name: Test
        run: ctest --test-dir build --build-config Debug --output-on-failure -j

  sanitize:
    name: ASan + UBSan headless suite (GCC 14, Debug)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      CC: gcc-14
      CXX: g++-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Data/ manifest hygiene check
        run: python3 scripts/generate_manifest.py --check --output Data/

      - name: Install toolchain (g++-14)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-14

      # The sanitizer flags ride CMAKE_CXX_FLAGS so FetchContent deps
      # (gtest, nlohmann/json) pick them up too — an unsanitized gtest
      # would still run the sanitized test bodies, but the flags here
      # keep every translation unit honest. Leak detection is on by
      # default on Linux; the sim's static clocks are function-local
      # statics (never freed by design), which LSan does not report.
      - name: Configure (headless, ASan + UBSan, boundary gate ON)
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DF4_ENFORCE_BOUNDARY=ON
          -DF4_BUILD_RENDERER=OFF
          -DF4_BUILD_MODEL_VIEWER=OFF
          -DF4_BUILD_VIEWER=OFF
          -DF4_BUILD_SCENARIO_PLAYER=OFF
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test (fast tier under the sanitizers)
        run: ctest --test-dir build --output-on-failure -j"$(nproc)"
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=0
